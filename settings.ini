# Language: all, de, en, zh or ja. Volume: 0 through 100.
language=all
volume=65
welcome=Num1
next=Num2
approaching=Num3
finish=Num5

# Announce the next stop after actually pulling away.
auto_next=on
# Use the final-stop announcement before arrival when the distance threshold is enabled.
auto_finish=on
# 0 = manual. In-game station radius or final-leg GPS fallback threshold, in metres.
auto_approach_m=0
